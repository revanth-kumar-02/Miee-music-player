name: Miee
description: "Miee - A premium, minimalist music player application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^17.3.0
  google_fonts: ^8.1.0

  just_audio: ^0.10.6
  audio_service: ^0.18.12
  audio_session: ^0.2.4

  on_audio_query: ^2.9.0

  permission_handler: ^12.0.3
  path_provider: ^2.1.3

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  dio: ^5.4.0
  url_launcher: ^6.2.5
  share_plus: ^13.2.0
  image_picker: ^1.1.2

  supabase_flutter: ^2.6.0
  connectivity_plus: ^7.2.0
  youtube_player_flutter: ^10.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/logo/miee_launcher_1024.png
  min_sdk_android: 21
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: assets/logo/miee_launcher_1024.png
  web:
    generate: true
    image_path: assets/logo/miee_launcher_1024.png
    background_color: "#0D0D0D"
    theme_color: "#0D0D0D"