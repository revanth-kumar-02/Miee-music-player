  </head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed"><header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(26,15,18,0.04)] pt-safe"><div class="h-16 px-space-md flex items-center justify-between relative"><button aria-label="Go back" class="min-w-[44px] min-h-[44px] w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container transition-colors active:scale-95" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">close</span></button><div class="absolute left-1/2 -translate-x-1/2 pointer-events-none text-center"><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight select-none">Create Playlist</h1></div><div class="flex items-center gap-space-sm"><button class="min-h-[44px] px-space-lg h-11 rounded-full bg-primary-container text-on-primary font-label-md text-label-md flex items-center justify-center shadow-[0_2px_8px_rgba(110,13,37,0.25)] hover:opacity-95 active:scale-95 transition-all" type="button"><span class="">Save</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center flex-shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full pb-8">

</div>

<span class="font-caption text-xs text-[#7D7577] mt-1">Or auto-pick 1st track</span>

</div>
<!-- Text Inputs Block -->

<!-- Playlist Name Field -->
<div class="flex flex-col">
<label class="font-label-sm text-[11px] font-bold text-[#7D7577] uppercase tracking-wider px-1 mb-2" for="playlist-title">Playlist Name</label>
<div class="relative flex items-center">
<input class="w-full h-[54px] px-4 rounded-xl bg-surface-container-lowest text-on-surface font-body-lg text-base border border-[#EBEAE6] shadow-sm placeholder:text-[#9E9698] focus:outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#6e0d25] transition-all" id="playlist-title" placeholder="Give your playlist a name" type="text" value="">

<!-- Playlist Description Field -->
<div class="flex flex-col">
<label class="font-label-sm text-[11px] font-bold text-[#7D7577] uppercase tracking-wider px-1 mb-2" for="playlist-desc">Description <span class="text-[#7D7577]/70 lowercase font-normal">(optional)</span></label>

<div class="flex flex-col">

</div>
<label class="relative inline-flex items-center cursor-pointer select-none flex-shrink-0">

</label>
</div>
</div>

<span class="material-symbols-outlined text-[20px]">library_music</span>
<span id="submit-btn-text" class="">Create Playlist</span>
</button>
<p class="font-caption text-xs text-[#7D7577] text-center mt-2.5">You can add and reorder songs at any time</p>
</div>
</div>
</div>
<script>
  (function initPlaylistCreator() {
    const list = document.getElementById('songs-list');
    const badge = document.getElementById('track-count-badge');
    const submitBtnText = document.getElementById('submit-btn-text');
    const emptyState = document.getElementById('empty-state');

    function updateTrackCounters() {
      const remainingTracks = list.querySelectorAll('.track-row');
      const count = remainingTracks.length;
      badge.textContent = count;
      submitBtnText.textContent = count > 0 ? `Create Playlist (${count} ${count === 1 ? 'Song' : 'Songs'})` : 'Create Empty Playlist';
      
      if (count === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }
    }

    list.addEventListener('click', function(e) {
      const removeBtn = e.target.closest('.remove-btn');
      if (!removeBtn) return;
      
      const row = removeBtn.closest('.track-row');
      if (row) {
        row.style.transform = 'translateX(20px)';
        row.style.opacity = '0';
        setTimeout(() => {
          row.remove();
          updateTrackCounters();
        }, 180);
      }
    });

    const coverInput = document.getElementById('cover-upload');
    coverInput.addEventListener('change', function(e) {
      if (e.target.files && e.target.files[0]) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const label = coverInput.previousElementSibling;
          label.innerHTML = '';
          label.style.backgroundImage = `url('${evt.target.result}')`;
          label.style.backgroundSize = 'cover';
          label.style.backgroundPosition = 'center';
          label.classList.add('shadow-md');
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });
  })();
</script></main>
