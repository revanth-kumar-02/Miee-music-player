<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<meta content="mobile_blank" name="shell-type">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#faf9f7",
            "surface": "#faf9f7",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f4f3f1",
            "surface-container": "#efeeec",
            "surface-container-high": "#e9e8e6",
            "surface-container-highest": "#e3e2e0",
            "on-surface": "#1a0f12",
            "on-surface-variant": "#67595c",
            "outline": "#897173",
            "outline-variant": "#e2dedf",
            "primary": "#4b0014",
            "primary-container": "#6e0d25",
            "on-primary": "#ffffff",
            "secondary": "#ba0032",
            "secondary-container": "#e41944",
            "error": "#ba1a1a"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans", "sans-serif"],
            "body": ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
<style>
    @layer base {
      html, body {
        width: 100vw;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #faf9f7;
        color: #1a0f12;
      }
      body {
        overscroll-behavior: none;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-[#faf9f7] font-body text-on-surface flex flex-col min-h-screen selection:bg-[#ffdadc] selection:text-[#400010]">
<!-- Subtle Realistic Android Status Bar -->

<main class="flex-1 flex flex-col justify-between px-6 pt-6 pb-8 max-w-md mx-auto w-full">
<!-- Top Block: Brand & Header -->
<div class="flex flex-col w-full">
<!-- Miee Brand Emblem & Wordmark -->
<div class="flex flex-col items-center justify-center pt-2 pb-8">
<div class="w-13 h-13 w-[52px] h-[52px] rounded-2xl bg-[#6e0d25] flex items-center justify-center shadow-sm mb-3">
<span class="material-symbols-outlined text-white text-2xl" style="font-variation-settings: &quot;FILL&quot; 1;">graphic_eq</span>
</div>
<div class="flex items-center gap-1">
<span class="font-headline text-2xl tracking-tight text-on-surface font-bold">miee</span>
<span class="w-1.5 h-1.5 rounded-full bg-[#ba0032] -mb-2"></span>
</div>

</div>
<!-- Welcome Editorial Heading -->
<div class="flex flex-col mb-7">
<h1 class="font-headline text-[28px] leading-tight text-[#1a0f12] font-bold tracking-tight mb-1.5">
          Welcome back
        </h1>
<p class="text-sm text-on-surface-variant font-normal">
          Pick up where the music left off.
        </p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5 w-full" id="login-form" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-on-surface tracking-wide" for="email">
            Email address
          </label>
<div class="relative w-full">
<input autocomplete="email" class="w-full h-[52px] px-4 rounded-xl bg-surface-container-lowest text-on-surface text-sm placeholder:text-neutral-400 border border-black/[0.06] shadow-sm transition-all focus:bg-white focus:outline-none focus:border-transparent focus:ring-2 focus:ring-[#6e0d25]" id="email" name="email" placeholder="Enter your email" type="email" value="">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-on-surface tracking-wide" for="password">
            Password
          </label>
<div class="relative w-full">
<input autocomplete="current-password" class="w-full h-[52px] pl-4 pr-12 rounded-xl bg-surface-container-lowest text-on-surface text-sm placeholder:text-neutral-400 border border-black/[0.06] shadow-sm transition-all focus:bg-white focus:outline-none focus:border-transparent focus:ring-2 focus:ring-[#6e0d25]" id="password" name="password" placeholder="Enter your password" type="password" value="">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-on-surface-variant/70 hover:text-on-surface focus:outline-none transition-colors" id="toggle-password-btn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-visibility-icon">visibility</span>
</button>
</div>
<!-- Forgot Password -->
<div class="flex justify-end pt-1">
<a class="text-xs text-[#6e0d25] font-semibold hover:text-[#ba0032] focus:outline-none transition-colors" href="#forgot-password">
              Forgot password?
            </a>
</div>
</div>
<!-- Primary Pill Button -->
<div class="pt-3">
<button class="w-full h-[54px] rounded-full bg-[#6e0d25] text-white text-base font-semibold flex items-center justify-center shadow-sm active:scale-[0.98] transition-all hover:bg-[#580a1d]" id="submit-button" type="submit">
            Log in
          </button>
</div>
</form>
</div>
<!-- Bottom Navigation / Account Creation -->
<div class="mt-8 text-center pb-2">
<p class="text-sm text-on-surface-variant">
        Don't have an account?
        <a class="font-semibold text-[#6e0d25] hover:text-[#ba0032] underline-offset-2 hover:underline transition-colors ml-1" href="#register">
          Create account
        </a>
</p>
</div>
</main>
<script>
    let isPasswordVisible = false;

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const visibilityIcon = document.getElementById('password-visibility-icon');
      
      isPasswordVisible = !isPasswordVisible;
      if (isPasswordVisible) {
        passwordInput.type = 'text';
        visibilityIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        visibilityIcon.textContent = 'visibility';
      }
    }
  </script>


</body></html>
