<!-- Simple script for scroll shadow effect on top bar -->
<script>
        const topBar = document.getElementById('top-bar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                topBar.classList.add('shadow-[0_4px_20px_rgba(0,0,0,0.04)]', 'bg-surface/90', 'backdrop-blur-md');
                topBar.classList.remove('bg-background');
            } else {
                topBar.classList.remove('shadow-[0_4px_20px_rgba(0,0,0,0.04)]', 'bg-surface/90', 'backdrop-blur-md');
                topBar.classList.add('bg-background');
            }
        });
