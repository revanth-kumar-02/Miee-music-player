<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;min-height:100%;background-color:#FAF9F7;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"on-error-container":"#93000a","surface-dim":"#dadad8","on-secondary-fixed-variant":"#920025","tertiary":"#22211e","tertiary-container":"#383633","error-container":"#ffdad6","on-background":"#1a1c1b","surface-container-lowest":"#ffffff","on-secondary":"#ffffff","on-surface":"#1a1c1b","background":"#faf9f7","secondary":"#ba0032","on-tertiary-fixed":"#1d1b18","on-tertiary-container":"#a39f9a","secondary-fixed":"#ffdada","surface-container":"#efeeec","tertiary-fixed":"#e7e2dc","surface-bright":"#faf9f7","on-tertiary-fixed-variant":"#494643","on-primary-container":"#f77788","on-error":"#ffffff","on-surface-variant":"#564243","on-primary":"#ffffff","inverse-surface":"#2f3130","primary-container":"#6e0d25","on-tertiary":"#ffffff","surface-container-highest":"#e3e2e0","primary-fixed-dim":"#ffb2b9","surface-container-high":"#e9e8e6","inverse-primary":"#ffb2b9","primary":"#4b0014","on-secondary-fixed":"#40000b","on-primary-fixed":"#400010","surface-variant":"#e3e2e0","on-primary-fixed-variant":"#852034","on-secondary-container":"#fffbff","primary-fixed":"#ffdadc","secondary-fixed-dim":"#ffb3b5","secondary-container":"#e41944","outline-variant":"#ddc0c1","outline":"#897173","surface":"#faf9f7","surface-tint":"#a4384a","error":"#ba1a1a","tertiary-fixed-dim":"#cac6c1","surface-container-low":"#f4f3f1","inverse-on-surface":"#f1f1ef"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"fontFamily":{"body-lg":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"caption":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"headline-xl-mobile":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"headline-sm":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"headline-xl":["Plus Jakarta Sans"]}}}};</script>
</head><body class="bg-[#FAF9F7] text-[#1A0F12] font-body-md min-h-screen flex flex-col antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- Pinned Header -->
<header class="sticky top-0 w-full z-50 bg-[#FAF9F7]/90 backdrop-blur-md border-b border-[#E5E0DC]/60 pt-safe">
<div class="h-14 px-4 flex items-center justify-between relative">
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full text-[#1A0F12] hover:bg-[#F4F3F1] transition-colors active:scale-95" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[22px]">close</span>
</button>
<div class="absolute left-1/2 -translate-x-1/2 pointer-events-none text-center">
<h1 class="font-semibold text-base text-[#1A0F12] tracking-tight">Create Playlist</h1>
</div>
<button class="px-5 py-2 rounded-full bg-[#6E0D25] text-white text-sm font-medium shadow-sm hover:bg-[#580a1d] active:scale-95 transition-all" type="button">
          Save
        </button>
</div>
</header>
<!-- Scrollable Form Container -->
<main class="flex-1 overflow-y-auto px-5 py-5 flex flex-col space-y-5 pb-safe">
<!-- Centered Cover Art Placeholder -->
<div class="flex flex-col items-center pt-1">
<label class="w-36 h-36 rounded-2xl bg-[#F4F3F1] border border-[#DADAD8]/60 flex flex-col items-center justify-center cursor-pointer hover:bg-[#EAE8E4] active:scale-98 transition-all p-3 text-center shadow-xs select-none group" for="cover-upload" id="cover-preview-box">
<div class="w-11 h-11 rounded-full bg-white flex items-center justify-center text-[#6E0D25] mb-2 shadow-xs group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[24px]">photo_camera</span>
</div>
<span class="font-medium text-xs text-[#1A0F12]">Add Cover</span>
<span class="text-[11px] text-[#6E0D25]/70 mt-0.5">Or auto-pick 1st track</span>
</label>
<input accept="image/*" class="sr-only" id="cover-upload" type="file"/>
</div>
<!-- Form Inputs -->
<div class="flex flex-col space-y-4">
<!-- Playlist Name -->
<div class="flex flex-col">
<label class="uppercase tracking-wider text-[11px] font-semibold text-[#8B7D82] px-1 mb-1.5" for="playlist-title">PLAYLIST NAME</label>
<input class="w-full h-[52px] px-4 rounded-xl bg-white border border-[#E5E0DC] text-sm text-[#1A0F12] placeholder:text-[#A09598] focus:border-[#6E0D25] focus:ring-1 focus:ring-[#6E0D25] focus:outline-none shadow-sm transition-all" id="playlist-title" placeholder="Give your playlist a name" type="text"/>
</div>
<!-- Description -->
<div class="flex flex-col">
<label class="uppercase tracking-wider text-[11px] font-semibold text-[#8B7D82] px-1 mb-1.5" for="playlist-desc">DESCRIPTION (optional)</label>
<textarea class="w-full h-[84px] p-3.5 rounded-xl bg-white border border-[#E5E0DC] text-sm text-[#1A0F12] placeholder:text-[#A09598] focus:border-[#6E0D25] focus:ring-1 focus:ring-[#6E0D25] focus:outline-none resize-none shadow-sm transition-all" id="playlist-desc" placeholder="Add an optional description..."></textarea>
</div>
<!-- Privacy Toggle Card -->
<div class="p-3.5 rounded-xl bg-white border border-[#E5E0DC]/80 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-full bg-[#F4F3F1] flex items-center justify-center text-[#1A0F12] flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">public</span>
</div>
<div class="flex flex-col">
<span class="font-semibold text-sm text-[#1A0F12]">Public Playlist</span>
<span class="text-xs text-[#8B7D82]">Anyone can view this playlist</span>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer select-none flex-shrink-0">
<input checked="" class="sr-only peer" id="privacy-toggle" type="checkbox"/>
<div class="w-11 h-6 bg-[#DADAD8] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#6E0D25]"></div>
</label>
</div>
</div>
<!-- Bottom Action -->
<div class="pt-3 pb-6 flex flex-col items-center">
<button class="w-full h-[52px] bg-[#6E0D25] text-white font-semibold text-sm rounded-full flex items-center justify-center shadow-md hover:bg-[#580a1d] active:scale-[0.99] transition-all" id="submit-playlist-btn" type="button">
          Create Playlist
        </button>
<p class="text-xs text-[#8B7D82] text-center mt-2.5">You can add songs to this playlist anytime</p>
</div>
</main>
<script>
      (function() {
        const coverInput = document.getElementById('cover-upload');
        const previewBox = document.getElementById('cover-preview-box');
        if (coverInput && previewBox) {
          coverInput.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
              const reader = new FileReader();
              reader.onload = function(evt) {
                previewBox.innerHTML = '';
                previewBox.style.backgroundImage = `url('${evt.target.result}')`;
                previewBox.style.backgroundSize = 'cover';
                previewBox.style.backgroundPosition = 'center';
              };
              reader.readAsDataURL(e.target.files[0]);
            }
          });
        }
      })();
    </script>
</body></html>
